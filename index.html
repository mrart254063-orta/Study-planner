<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Study planner</h1>
  <p class="sub" id="date"></p>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="today">Today</button>
    <button role="tab" data-tab="tasks">Tasks</button>
    <button role="tab" data-tab="week">Week</button>
  </nav>
  <div id="view"></div>
</main>
<script src="script.js"></script>
</body>
</html>
